<!-- Search of the log over all its entries, opened by its button beside Log +: the search field of the page, which
     search.ts puts around its field, then the entries that hold what I type, newest first, each what it was and below
     it its day and time, small and grey; a click on one opens its dialog on its day, and closing that dialog brings
     the results back, see search.ts -->
<dialog class="panel search-panel" id="search" closedby="any">
    <div class="panel-form search-form">
        <input id="search-text" enterkeyhint="search">
        <p class="panel-error" id="search-error" hidden>The log cannot be read</p>
        <ol class="search-results" id="search-results"></ol>
    </div>
</dialog>
