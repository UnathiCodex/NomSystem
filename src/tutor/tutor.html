<!-- Tutorials: the bar of the shown week, as the day has its day; below it, for each of my modules with groups,
     every session of every group of that week, the one I go to marked -->
<div class="food tutor">
    <!-- The number of the week small and grey above its days, between its arrows, a small icon beside it back to this
         week, faded and off on this week -->
    <div class="day-bar food-bar">
        <button class="day-arrow" id="tutor-before" type="button"></button>
        <h2 class="day-title food-day-title"><span class="day-weekday tutor-week" id="tutor-week"></span> <span
            class="day-date" id="tutor-days"></span></h2>
        <button class="day-today" id="tutor-today" type="button" disabled></button>
        <button class="day-arrow" id="tutor-after" type="button"></button>
    </div>

    <!-- One card per module and type of its groups, filled by tutor.ts -->
    <section class="tutor-cards" id="tutor-cards"></section>
</div>
