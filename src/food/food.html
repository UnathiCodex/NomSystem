<!-- Food: the bar of the shown day as the day has it; below it what I ate that day with its totals, beside my foods
     with the search that also finds them on Open Food Facts -->
<div class="food">
    <!-- The date of the shown day between its arrows, a small icon beside it back to today, faded and off on today -->
    <div class="food-bar">
        <button class="food-arrow" id="food-before" type="button"></button>
        <h2 class="food-day-title"><span class="food-weekday" id="food-weekday"></span> <span id="food-date"></span></h2>
        <button class="food-today" id="food-today" type="button" disabled></button>
        <button class="food-arrow" id="food-after" type="button"></button>
    </div>

    <!-- Day: its totals, then its meals from the log, each with its foods -->
    <section class="food-day">
        <div id="food-totals"></div>
        <div id="food-meals"></div>
    </section>

    <!-- My foods: the search shows mine first, then those of Open Food Facts, and adds new ones -->
    <section class="food-foods">
        <h2 class="food-heading">Foods</h2>
        <div id="food-search"></div>
    </section>
</div>
