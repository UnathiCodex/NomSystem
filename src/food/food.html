<!-- Food: what I ate on a day with its totals, and my foods with the search that also finds them on Open Food Facts -->
<div class="food">
    <!-- Day: arrows and its date, its totals, then its meals from the log, each with its foods -->
    <section class="food-day">
        <div class="food-head">
            <button id="food-before" type="button" title="Day before">‹</button>
            <button id="food-today" type="button">Today</button>
            <button id="food-after" type="button" title="Day after">›</button>
            <h2 id="food-date"></h2>
        </div>
        <div id="food-totals"></div>
        <div id="food-meals"></div>
    </section>

    <!-- My foods: the search shows mine first, then those of Open Food Facts, and adds new ones -->
    <section class="food-foods">
        <h2 class="food-heading">Foods</h2>
        <div id="food-search"></div>
    </section>
</div>
