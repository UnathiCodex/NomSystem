<!-- Food: the bar of the shown day as the day has it; below it what I ate that day with its totals, beside my foods
     with the search that also finds them on Open Food Facts -->
<div class="food">
    <!-- The date of the shown day between its arrows, a small icon beside it back to today, faded and off on today -->
    <div class="day-bar food-bar">
        <button class="day-arrow" id="food-before" type="button"></button>
        <h2 class="day-title food-day-title"><span class="day-weekday" id="food-weekday"></span> <span class="day-date"
            id="food-date"></span></h2>
        <button class="day-today" id="food-today" type="button" disabled></button>
        <button class="day-arrow" id="food-after" type="button"></button>
    </div>

    <!-- Day: its totals, then its meals from the log, each with its foods -->
    <section class="food-day">
        <div id="food-totals"></div>
        <div id="food-meals"></div>
    </section>

    <!-- My meals with their foods above my foods, filled by meals.ts;
         my foods: the search shows mine first, then those of Open Food Facts, and adds new ones; the plus beside
         the name Foods opens the form of a food typed by hand -->
    <section class="food-foods">
        <div id="food-dishes"></div>
        <h2 class="food-heading" id="food-foods-heading">Foods</h2>
        <div id="food-search"></div>
    </section>
</div>
