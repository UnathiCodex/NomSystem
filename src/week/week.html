<!-- Week: the boxes of seven days from today on, one row per day, to see what is coming, like a doctor's visit;
     a click on a day opens it in the day view -->
<div class="week">
    <!-- Arrows and Today, then the seven days, like above plan and log of the day;
         a click on the days opens the month to pick the first day from, see month.ts -->
    <div class="day-bar">
        <div class="day-buttons">
            <button id="week-back" type="button"></button>
            <button id="week-today" type="button">Today</button>
            <button id="week-next" type="button"></button>
        </div>
        <h2 class="day-title"><button class="day-title-button" id="week-title" type="button" title="Pick the first day"></button></h2>
    </div>

    <!-- One row per day: its name, then its birthdays and holidays and its boxes; filled by week.ts -->
    <div class="week-days" id="week-days"></div>
</div>
