<!-- Editor, one view with the notes: the tree on the left, the file on the right, a draft note or a file of my new
     system as its text, its Markdown shown as in the notes away from the cursor, saved exactly as edited -->
<div class="editor">
    <!-- Tree with two roots, NomManageplannings and NomSkillingmodules, the same as in the notes, see notes/tree.ts -->
    <nav class="notes-tree" id="notes-tree"></nav>

    <!-- The file, scrolls alone -->
    <div class="editor-file">
        <!-- Page of the file in the reading width of the scripts view, in the middle -->
        <div class="editor-page">
            <!-- Head: name of the file, whether its changes are saved, and the save button;
                 stays on top while scrolling -->
            <div class="editor-head">
                <h1 class="editor-title" id="editor-title"></h1>
                <span class="editor-state" id="editor-state"></span>
                <button type="button" class="editor-save" id="editor-save"></button>
            </div>

            <!-- Text of the file, CodeMirror inside; `markdown` gives the rendered pieces of a Markdown file the look
                 of the scripts view, `editor-plain` shows any other file as its plain text -->
            <div class="editor-text markdown" id="editor-text"></div>
        </div>
    </div>
</div>
