<!-- Editor: one draft note as its text, its Markdown shown as in the notes away from the cursor, saved exactly as edited -->
<div class="editor">
    <!-- Page of the note in the reading width of the notes view, in the middle -->
    <div class="editor-page">
        <!-- Head: name of the note, whether its changes are saved, and the save button; stays on top while scrolling -->
        <div class="editor-head">
            <h1 class="editor-title" id="editor-title"></h1>
            <span class="editor-state" id="editor-state"></span>
            <button type="button" class="editor-save" id="editor-save"></button>
        </div>

        <!-- Text of the note, CodeMirror inside; `markdown` gives its rendered pieces the look of the notes view -->
        <div class="editor-text markdown" id="editor-text"></div>
    </div>
</div>
