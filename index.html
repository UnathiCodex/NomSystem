<!doctype html>
<html lang="en">
    <head>
        <!-- Read file as utf-8, unicode encoding of every character -->
        <meta charset="utf-8">

        <!-- Use viewport which the phone browser reports us and not the fixed 980; the keyboard of a phone makes the page
             smaller instead of covering it, so a dialog and the menu of a list stay above it while I type -->
        <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">

        <!-- Name of page, shown in browser tab -->
        <title>NomSystem</title>

        <!-- Logo, shown in browser tab; file in assets, given out as it is -->
        <link rel="icon" href="/icon.svg" type="image/svg+xml">

        <!-- Name, colours and logos with which the phone installs the page as an app on its home screen -->
        <link rel="manifest" href="/manifest.webmanifest">

        <!-- Colour of the phone's status bar above the page, same as the page background -->
        <meta name="theme-color" content="#1e1e1e">

        <!-- Colours, sizes and look of the whole page, read before the page first shows,
             so switching areas never flashes a white, unstyled page -->
        <link rel="stylesheet" href="/src/variants.css">
        <link rel="stylesheet" href="/src/base.css">

        <!-- Type module allows import in the ts file, source main.ts in src -->
        <script type="module" src="/src/main.ts"></script>
    </head>

    <body>
        <!-- Areas of the life system at the left edge, each by its icon from Lucide, written here, so it shows
             at once and no word flashes before it, its name as tooltip: a day, an open book for the scripts
             of NomSkillingmodules, an open folder for NomManageplannings, fork and knife for the food,
             a dumbbell for the sport; main.ts marks the shown one and opens it -->
        <nav class="areas">
            <a href="/" class="icon-button" title="Day" aria-label="Day"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 13h1v4"/><path d="M16 2v3"/><path d="M3 9h18"/><path d="M8 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg></a>
            <a href="/scripts" class="icon-button" title="NomSkillingmodules" aria-label="NomSkillingmodules"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v16"/><path d="M16 13h2"/><path d="M16 9h2"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/><path d="M6 13h2"/><path d="M6 9h2"/></svg></a>
            <a href="/plannings" class="icon-button" title="NomManageplannings" aria-label="NomManageplannings"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg></a>
            <a href="/food" class="icon-button" title="Food" aria-label="Food"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></a>
            <a href="/sport" class="icon-button" title="Sport" aria-label="Sport"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg></a>
        </nav>
    </body>
</html>
